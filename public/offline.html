<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>Offline · Trust Manager</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F8FAFC; color: #172554;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .card { max-width: 360px; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 30px rgba(15,23,42,.06); }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: #64748B; font-size: 14px; line-height: 1.5; margin: 0 0 6px; }
  button { margin-top: 16px; background: #16A34A; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; width: 100%; }
</style>
</head>
<body>
  <div class="card">
    <img src="/brand/icon-192.png" alt="Trust Manager">
    <h1>You're offline</h1>
    <p>Trust Manager needs the internet to load your household's money.</p>
    <p lang="rw">Nta murandasi uhari. Ongera ugerageze umaze kubona umurandasi.</p>
    <button onclick="location.reload()">Try again · Ongera ugerageze</button>
  </div>
</body>
</html>
